// Detective Eye — Minecraft 1.20.1 Forge client-side block highlighter
// https://github.com/<you>/orevision

// 加 -PcnMirrors 时优先走国内镜像（BMCLAPI），默认用 Forge 官方源。
buildscript {
    repositories {
        if (gradle.startParameter.projectProperties.containsKey('cnMirrors')) {
            maven { name = 'BMCLAPI'; url = 'https://bmclapi2.bangbang93.com/maven/' }
            maven { name = 'BMCLAPI-UNICOM'; url = 'https://unicom.mirrors.ustc.edu.cn/bmclapi/' }
            maven { name = 'Aliyun'; url = 'https://maven.aliyun.com/repository/public' }
        }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
    }
}

plugins { id 'java' }

def cn = gradle.startParameter.projectProperties.containsKey('cnMirrors')

// ForgeGradle 在 apply 阶段就会抓取 project.repositories，之后再加的仓库对它无效，
// 所以必须在 apply 之前声明。
repositories {
    if (cn) {
        maven { name = 'BMCLAPI'; url = 'https://bmclapi2.bangbang93.com/maven/' }
        maven { name = 'BMCLAPI-UNICOM'; url = 'https://unicom.mirrors.ustc.edu.cn/bmclapi/' }
        maven { name = 'Aliyun'; url = 'https://maven.aliyun.com/repository/public' }
    }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

apply plugin: 'net.minecraftforge.gradle'

group = 'com.orevision'
version = '1.1.0'
base { archivesName = 'detective-eye' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // 开发期自检开关：gradle runClient -Dorevision.selftest=true
            property 'orevision.selftest', System.getProperty('orevision.selftest', 'false')
            // LWJGL 需要把 natives 解压到一个可写的临时目录；在 DSH 沙箱里 TEMP 会指向 /tmp，
            // Java 认不出这个 MSYS 路径，会报 "Failed to find an appropriate directory to extract the native library"。
            def javaTmpDir = project.file('../tmp/javatmp')
            javaTmpDir.mkdirs()
            jvmArgs "-Djava.io.tmpdir=${javaTmpDir.absolutePath}"
            mods { orevision { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// 注意：不要试图改 build/classpath/runClient_minecraftClasspath.txt 来剔除 x86/arm64 natives，
// 那是 prepareRunClient 的产物、每轮都会重写，且真正卡住启动的是上面的 java.io.tmpdir。

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'orevision',
                'Specification-Vendor'    : 'orevision',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'orevision'
        ])
    }
}
