# Gradle 构建 JVM：ForgeGradle 首轮 remap 吃内存，2.5G 足够
org.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false

# ForgeGradle 6 在应用插件阶段会直连 maven.minecraftforge.net 做连通性检查（无读超时），
# 网络不稳时会无限期挂住整个配置阶段。这里关掉它；只影响构建期自检，不影响产物。
systemProp.net.minecraftforge.gradle.check.certs=false
